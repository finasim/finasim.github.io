<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
>
  <style>
    .background {
      fill: #111827;
    }

    .border {
      fill: none;
      stroke: #ffffff;
    }

    .logo {
      fill: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      .background {
        fill: #ffffff;
      }

      .border {
        stroke: #111827;
      }

      .logo {
        fill: #111827;
      }
    }
  </style>

  <!-- Background -->
  <rect
    class="background"
    x="2"
    y="2"
    width="60"
    height="60"
    rx="13"
  />

  <!-- Outer border -->
  <rect
    class="border"
    x="3.5"
    y="3.5"
    width="57"
    height="57"
    rx="12"
    stroke-width="2"
  />

  <!-- Inner border -->
  <rect
    class="border"
    x="8"
    y="8"
    width="48"
    height="48"
    rx="9"
    stroke-width="1.5"
  />

  <!-- FIN -->
  <text
    class="logo"
    x="32"
    y="32"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="700"
    letter-spacing="0"
  >FIN</text>
</svg>